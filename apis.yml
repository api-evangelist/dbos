  - aid: dbos:dbos-cloud
    name: DBOS Cloud
    description: >-
      DBOS Cloud is the managed, serverless hosting platform for DBOS
      workflows, queues, and scheduled jobs. The CLI deploys and manages
      DBOS applications and provides a graphical observability UI.
