aid: dbos
name: DBOS
description: >-
  DBOS is a durable execution platform built on Postgres for running
  resilient workflows, scheduled jobs, durable queues, and Kafka consumers.
  The core library (DBOS Transact) is available for Python, TypeScript,
  Go, and Java, with a managed serverless runtime offered as DBOS Cloud.
