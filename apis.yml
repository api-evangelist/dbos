apis:
  - aid: dbos:dbos
    name: DBOS Transact
    description: >-
      DBOS Transact is a durable execution library that decorates application
      functions with workflow, step, transaction, scheduled, and Kafka
      consumer semantics, persisting all state to Postgres so workflows can
      survive crashes and resume from checkpoints. SDKs are published for
      Python, TypeScript, Go, and Java.
    humanURL: https://docs.dbos.dev/
    tags:
      - API Composition
      - Durable Execution
      - Library
      - Workflows
    tags_raw:
      - API Composition
      - Durable Execution
